name: Build Windows .exe + Android APK/AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Force recreate Windows files for VS2022
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force android -ErrorAction SilentlyContinue
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare --overwrite
          flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Create portable ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath HomeCare-Windows-Portable.zip
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Windows-Portable
          path: |
            build/windows/x64/runner/Release/
            HomeCare-Windows-Portable.zip
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Recreate platforms
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force android -ErrorAction SilentlyContinue
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare --overwrite
          flutter pub get
        shell: bash
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
