name: Build Windows .exe + Android APK/AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Create Windows platform only
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          if (Test-Path android) { Remove-Item -Recurse -Force android }
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare
          flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Create portable ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath HomeCare-Windows-Portable.zip
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Windows-Portable
          path: |
            build/windows/x64/runner/Release/
            HomeCare-Windows-Portable.zip
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Recreate platforms without overwriting lib
        run: |
          rm -rf windows android
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare
          flutter pub get
        shell: bash
      - name: Fix Android desugaring for notifications
        run: |
          python3 << 'PY'
          import pathlib, re
          kts = pathlib.Path("android/app/build.gradle.kts")
          gradle = pathlib.Path("android/app/build.gradle")
          if kts.exists():
              p = kts
              text = p.read_text()
              print("Fixing KTS file")
              # 1. Ensure compileOptions has isCoreLibraryDesugaringEnabled = true
              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = text.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              # 2. Ensure dependencies has the desugar lib
              if "desugar_jdk_libs" not in text:
                  text = text.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")')
              p.write_text(text)
              print(p.read_text()[:2000])
          elif gradle.exists():
              p = gradle
              text = p.read_text()
              print("Fixing Groovy file")
              if "coreLibraryDesugaringEnabled" not in text:
                  text = text.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              if "desugar_jdk_libs" not in text:
                  text = text.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
              p.write_text(text)
              print(p.read_text()[:2000])
          else:
              print("No build file found!")
          PY
        shell: bash
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
