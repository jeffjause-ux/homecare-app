name: Build Windows .exe + Android APK/AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Create Windows platform only
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          if (Test-Path android) { Remove-Item -Recurse -Force android }
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare
          flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Create portable ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath HomeCare-Windows-Portable.zip
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Windows-Portable
          path: |
            build/windows/x64/runner/Release/
            HomeCare-Windows-Portable.zip
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Recreate platforms without overwriting lib
        run: |
          rm -rf windows android
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare
          flutter pub get
        shell: bash
              - name: Fix Android desugaring for notifications
        run: |
          echo "Fixing android/app/build.gradle for flutter_local_notifications"
          FILE="android/app/build.gradle"
          if [ ! -f "$FILE" ]; then
            FILE="android/app/build.gradle.kts"
          fi
          # Add coreLibraryDesugaring dependency if missing
          if ! grep -q "desugar_jdk_libs" "$FILE"; then
            sed -i "/dependencies {/a \    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'" "$FILE"
          fi
          # Enable coreLibraryDesugaringEnabled
          if grep -q "coreLibraryDesugaringEnabled" "$FILE"; then
            sed -i "s/coreLibraryDesugaringEnabled.*/coreLibraryDesugaringEnabled true/" "$FILE"
          else
            sed -i "/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true\n        coreLibraryDesugaringEnabled true" "$FILE"
          fi
          cat "$FILE"
        shell: bash
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
