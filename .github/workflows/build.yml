name: Build Windows .exe + Android APK/AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Create Windows platform only
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          if (Test-Path android) { Remove-Item -Recurse -Force android }
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare
          flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Create portable ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath HomeCare-Windows-Portable.zip
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Windows-Portable
          path: |
            build/windows/x64/runner/Release/
            HomeCare-Windows-Portable.zip
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Recreate platforms and FIX desugaring file completely
        run: |
          rm -rf windows android
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare
          flutter pub get
          cat > android/app/build.gradle.kts << 'KTS'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.homecare.home_maintenance_app"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
                  isCoreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8.toString()
              }

              defaultConfig {
                  applicationId = "com.homecare.home_maintenance_app"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          KTS
          echo "=== NEW build.gradle.kts ==="
          cat android/app/build.gradle.kts
        shell: bash
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
