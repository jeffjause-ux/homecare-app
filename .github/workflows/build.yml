name: Build Windows .exe + Android APK/AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-windows:
    name: Build Windows .exe + MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      - name: Get dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Create MSIX installer
        run: dart run msix:create
        continue-on-error: true
      - name: Create portable ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath HomeCare-Windows-Portable.zip
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Windows-Portable
          path: |
            build/windows/x64/runner/Release/
            HomeCare-Windows-Portable.zip
          retention-days: 30
      - name: Upload MSIX if created
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-MSIX-Installer
          path: build/windows/x64/runner/Release/*.msix
          retention-days: 30
        continue-on-error: true
  build-android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.x'
      - name: Get dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build APK
        run: flutter build apk --release
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
