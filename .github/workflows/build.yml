name: Build Windows .exe + Android APK/AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Create Windows platform only
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          if (Test-Path android) { Remove-Item -Recurse -Force android }
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare
          flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Create portable ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath HomeCare-Windows-Portable.zip
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Windows-Portable
          path: |
            build/windows/x64/runner/Release/
            HomeCare-Windows-Portable.zip
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter - LATEST
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Recreate platforms - PIN to 8.11.1 + patch desugaring
        run: |
          rm -rf windows android
          flutter create . --platforms=windows,android --project-name home_maintenance_app --org com.homecare
          flutter pub get
          python3 << 'PY'
          import pathlib, re
          # 1. PIN AGP to 8.11.1 in settings.gradle.kts
          settings = pathlib.Path("android/settings.gradle.kts")
          txt = settings.read_text()
          txt = re.sub(r'id\("com.android.application"\) version "[^"]+"', 'id("com.android.application") version "8.11.1"', txt)
          txt = re.sub(r'id\("com.android.tools.build"\) version "[^"]+"', 'id("com.android.tools.build") version "8.11.1"', txt)
          # handle any 9.x reference
          txt = txt.replace('9.0.0', '8.11.1').replace('9.0', '8.11.1')
          settings.write_text(txt)
          print("=== settings.gradle.kts ===")
          print(settings.read_text()[:2000])

          # 2. PATCH app/build.gradle.kts - add desugaring to Flutter's own file, don't replace it
          app = pathlib.Path("android/app/build.gradle.kts")
          t = app.read_text()
          print("\n=== BEFORE PATCH app/build.gradle.kts ===")
          print(t[:3000])

          # Add isCoreLibraryDesugaringEnabled = true inside compileOptions if missing
          if "isCoreLibraryDesugaringEnabled" not in t:
              t = t.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")

          # Add desugar dependency inside dependencies if missing
          if "desugar_jdk_libs" not in t:
              if "dependencies {" in t:
                  t = t.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")')
              else:
                  t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          app.write_text(t)
          print("\n=== AFTER PATCH ===")
          print(app.read_text()[:3000])
          PY
        shell: bash
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
