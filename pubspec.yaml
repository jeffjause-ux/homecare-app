name: home_maintenance_app
description: Comprehensive offline-first Home Maintenance & Repair Manager for Windows + Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.22
  drift_flutter: ^0.2.3
  path: ^1.8.3
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  fl_chart: ^0.69.0
  pdf: ^3.11.0
  printing: ^5.12.0
  window_manager: ^0.3.8
  msix: ^3.16.8
  mobile_scanner: ^5.2.0
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

msix_config:
  display_name: HomeCare - Maintenance Manager
  publisher_display_name: HomeCare Labs
  identity_name: HomeCare.MaintenanceManager
  msix_version: 1.0.0.0
  logo_path: assets/icon.png
  capabilities: internetClient, picturesLibrary, documentsLibrary